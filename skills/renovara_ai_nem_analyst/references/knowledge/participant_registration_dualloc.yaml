PARTICIPANT_REGISTRATION_DUALLOC:
  table_name: silver___participant_registration_dualloc
  display_name: Participant Registration Dualloc
  table_comment: 'DUALLOC cross references dispatch unit identifier (DUID) to genset ID (GENSETID), effective-dated
    and versioned: for a DUID, the rows with the latest EFFECTIVEDATE on or before a date, at that date''s
    highest VERSIONNO, are the gensets in force. One DUID can map to several gensets (HVGTS -> GH01, GH02).
    Full history back to 1998, retired units included. One full copy per MMSDM archive month loaded (from
    2026-01), so the same key repeats once per month: SELECT DISTINCT before counting.'
  primary_keys:
  - EFFECTIVEDATE
  - VERSIONNO
  - DUID
  - GENSETID
  indexes:
  - LASTCHANGED
  visibility: Public
  update_frequency: Monthly
  schema:
  - column: EFFECTIVEDATE
    data_type: string
    comment: Effective calendar date of record (parsed to timestamp in silver). AEST.
  - column: VERSIONNO
    data_type: smallint
    comment: Version number of record for the effective date; the highest applies
  - column: DUID
    data_type: string
    comment: Dispatchable unit identifier
  - column: GENSETID
    data_type: string
    comment: Physical unit identifier (joins to PARTICIPANT_REGISTRATION_GENUNITS.GENSETID)
  - column: LASTCHANGED
    data_type: string
    comment: Last date and time record changed (parsed to timestamp in silver). AEST.
