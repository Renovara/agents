ROOFTOP_FORECAST:
  table_name: silver_rooftop_pv_forecast_rooftop_forecast
  display_name: Rooftop Forecast
  table_comment: AEMO's regional forecast of rooftop solar (distributed PV) generation, half-hourly over
    the next 8 days, in MW at the interval end. Republished every 30 minutes, so the same target INTERVAL_DATETIME
    is forecast up to 379 times by successive runs. VERSION_DATETIME identifies the forecast run and is
    part of the primary key — a query that does not pin it averages across superseded vintages. For the
    current view of a future interval use QUALIFY ROW_NUMBER() OVER (PARTITION BY REGIONID, INTERVAL_DATETIME
    ORDER BY VERSION_DATETIME DESC) = 1; to measure forecast error, join a chosen VERSION_DATETIME against
    ROOFTOP_ACTUAL on (REGIONID, INTERVAL_DATETIME) with TYPE = 'MEASUREMENT'. POWERPOELOW and POWERPOEHIGH
    bracket the forecast — note the naming is by probability of exceedance, so POWERPOELOW (90% POE) is
    the LOWER MW value. Source AEMO table ROOFTOP_PV_FORECAST.
  primary_keys:
  - VERSION_DATETIME
  - REGIONID
  - INTERVAL_DATETIME
  indexes:
  - LASTCHANGED
  visibility: Public
  update_frequency: Every 30 minutes
  schema:
  - column: VERSION_DATETIME
    data_type: STRING
    comment: Date and time this forecast run was produced, identifying the vintage (parsed to timestamp
      in silver). Part of the primary key — pin it or the same target interval is counted once per run.
      Timestamp is in AEST or Australia/Brisbane.
  - column: REGIONID
    data_type: STRING
    comment: Region identifier. One of NSW1, QLD1, SA1, TAS1, VIC1.
  - column: INTERVAL_DATETIME
    data_type: STRING
    comment: The half-hour interval the forecast applies to, interval ending, up to 8 days after VERSION_DATETIME
      (parsed to timestamp in silver). Timestamp is in AEST or Australia/Brisbane.
  - column: POWERMEAN
    data_type: DECIMAL(12,3)
    comment: Average forecast rooftop PV generation in MW at the interval end.
  - column: POWERPOE50
    data_type: DECIMAL(12,3)
    comment: 50% probability-of-exceedance (median) forecast value in MW at the interval end.
  - column: POWERPOELOW
    data_type: DECIMAL(12,3)
    comment: 90% probability-of-exceedance forecast value in MW at the interval end. Named LOW because
      90% POE is the LOWER MW bound — the value expected to be exceeded 9 times in 10.
  - column: POWERPOEHIGH
    data_type: DECIMAL(12,3)
    comment: 10% probability-of-exceedance forecast value in MW at the interval end. Named HIGH because
      10% POE is the UPPER MW bound — the value expected to be exceeded only 1 time in 10.
  - column: LASTCHANGED
    data_type: STRING
    comment: Last date and time the record changed (parsed to timestamp in silver). Timestamp is in AEST
      or Australia/Brisbane.
