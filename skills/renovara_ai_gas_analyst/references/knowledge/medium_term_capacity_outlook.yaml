MEDIUM_TERM_CAPACITY_OUTLOOK:
  table_name: silver_gbb_medium_term_capacity_outlook
  display_name: Medium Term Capacity Outlook
  table_comment: 'AEMO Gas Bulletin Board medium-term capacity outlook. AEMO: "Provides a report of the
    Capacity Outlook for the medium term to identify possible impact to future supply." This is the GASBB_MEDIUM_TERM_OUTLOOK_FUTURE
    variant, containing current and future outlooks. [AI-generated] Where silver_gbb_short_term_capacity_outlook
    covers individual gas days, this covers date ranges up to several years ahead. The denormalised ReceiptLocationName
    / DeliveryLocationName columns are NOT projected into silver -- they are unreliable aliases of the
    connection point register and were the sole cause of duplicate rows on the natural key. Join ReceiptLocation
    / DeliveryLocation to silver_gbb_nodes_connection_points.ConnectionPointId for the authoritative name;
    both columns remain in the bronze table. Column comments are from the AEMO guide v2.2 section 4.5
    except those marked [AI-generated].'
  primary_keys:
  - FacilityId
  - FromGasDate
  - ToGasDate
  - CapacityType
  - FlowDirection
  - ReceiptLocation
  - DeliveryLocation
  visibility: Public
  update_frequency: Updated within 30 minutes of receiving new data; current and future outlooks
  schema:
  - column: FacilityName
    data_type: STRING
    comment: Name of the plant. [AI-generated] Not a stable key -- join on FacilityId.
  - column: FacilityId
    data_type: INT
    comment: Unique plant identifier. [AI-generated] Join to silver_gbb_facilities.FacilityId.
  - column: FromGasDate
    data_type: string
    comment: Date of gas day. Any time component supplied is ignored. The gas day is applicable under
      the pipeline contract or market rules. [AI-generated] First gas day the outlook quantity applies
      to; stored as `yyyy/MM/dd`.
  - column: ToGasDate
    data_type: string
    comment: Date of gas day. Any time component supplied is ignored. The gas day is that applicable under
      the pipeline contract or market rules. [AI-generated] Last gas day the outlook quantity applies
      to; ranges of several years are normal.
  - column: CapacityType
    data_type: STRING
    comment: 'Capacity type values can be: STORAGE -- holding capacity in storage; or MDQ -- daily maximum
      firm capacity under the expected operating conditions.'
  - column: FlowDirection
    data_type: STRING
    comment: 'Gas flow direction. RECEIPT: the flow of gas into the BB storage facility or LNG import.
      DELIVERY: the flow of gas out of the BB storage facility or LNG export. PROCESSED: used only for
      capacities -- for LNG export the amount of gas that can be processed to a liquefied state on a gas
      day, for LNG import the amount that can be received and processed into storage. DELIVERYLNGSTOR:
      used only for capacities -- for LNG import, the amount of gas withdrawn from storage for processing
      to a gaseous state on a gas day. [AI-generated] NONE also occurs in the live data and is the most
      common value.'
  - column: ReceiptLocationName
    data_type: STRING
    comment: The name of the receipt location. [AI-generated] NOT projected into silver -- an unreliable
      alias. Observed disagreeing with silver_gbb_nodes_connection_points.ConnectionPointName for the
      same id (file "Ballera Receipt Stream" vs register "CGP Ballera Entry"), and it was the sole cause
      of duplicate rows on the natural key. Bronze only; join ReceiptLocation to the connection point
      register instead. Guide misspells the field `ReciptLocationName`.
  - column: ReceiptLocation
    data_type: INT
    comment: The Connection Point Id that best represents the receipt location. The Receipt Location in
      conjunction with the Delivery Location indicates the capacity direction and location. Applicable
      to BB pipelines only; for other BB facilities this field is populated with -1. [AI-generated] Join
      to silver_gbb_nodes_connection_points.ConnectionPointId.
  - column: DeliveryLocationName
    data_type: STRING
    comment: The name of the delivery location. [AI-generated] NOT projected into silver, for the same
      reason as ReceiptLocationName. Bronze only; join DeliveryLocation to the connection point register
      instead.
  - column: DeliveryLocation
    data_type: INT
    comment: The Connection Point Id that best represents the delivery location. The Delivery Location
      in conjunction with the Receipt Location indicates the capacity direction and location. Applicable
      to BB pipelines only; for other BB facilities this field is populated with -1. [AI-generated] Join
      to silver_gbb_nodes_connection_points.ConnectionPointId.
  - column: CapacityDescription
    data_type: STRING
    comment: Free text to describe the meaning of the capacity number provided, including a description
      of material factors that impact the capacity number and any other relevant information. Will only
      be shown for Pipelines and Compression facilities, and may be shown for LNGImport facilities.
  - column: OutlookQuantity
    data_type: DECIMAL(15,3)
    comment: Capacity outlook quantity in TJ to three decimal places. Three decimal places is not required
      if the value has trailing zeros after the decimal place.
  - column: Description
    data_type: STRING
    comment: '[AI-generated] Operator''s free-text condition note; the AEMO guide''s field table does
      not define this column, but its example gives "Corrective maintenance requiring reduction of operating
      pressure". Populated on every observed row, most commonly "Normal conditions".'
  - column: LastUpdated
    data_type: string
    comment: '[AI-generated] When the operator last submitted or revised this outlook, `yyyy/MM/dd HH:mm:ss`
      AEST. Not defined in the guide''s field table for this report.'
