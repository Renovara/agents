SHORT_TERM_CAPACITY_OUTLOOK:
  table_name: silver_gbb_short_term_capacity_outlook
  display_name: Short Term Capacity Outlook
  table_comment: 'AEMO Gas Bulletin Board short-term capacity outlook. AEMO: "This report displays the
    expected daily capacity of a BB facility for the next seven days." This is the GASBB_SHORT_TERM_CAPACITY_OUTLOOK_FUTURE
    variant, containing data in the seven day outlook window. [AI-generated] A drop against the usual
    level is a planned or forced outage, which is the signal worth joining to gas-fired generation availability
    in the NEM tables. As with the medium-term outlook, the denormalised ReceiptLocationName / DeliveryLocationName
    columns are NOT projected into silver -- they disagree with the connection point register, in one
    case labelling a point "Ballera Receipt Stream" that the register calls "CGP Ballera Exit". Join the
    id columns to silver_gbb_nodes_connection_points.ConnectionPointId instead; both name columns remain
    in bronze. Column comments are from the AEMO guide v2.2 section 4.12 except those marked [AI-generated].'
  primary_keys:
  - FacilityId
  - GasDate
  - CapacityType
  - FlowDirection
  - ReceiptLocation
  - DeliveryLocation
  visibility: Public
  update_frequency: Typically updated within 30 minutes of receiving new data; seven day outlook window
  schema:
  - column: FacilityId
    data_type: INT
    comment: A unique AEMO defined Facility Identifier. [AI-generated] Join to silver_gbb_facilities.FacilityId.
  - column: FacilityName
    data_type: STRING
    comment: The name of the BB facility. [AI-generated] Not a stable key -- join on FacilityId.
  - column: CapacityType
    data_type: STRING
    comment: 'Capacity type values can be: STORAGE -- holding capacity in storage; or MDQ -- daily maximum
      firm capacity under the expected operating conditions.'
  - column: CapacityTypeDescription
    data_type: STRING
    comment: Description of the Capacity Type.
  - column: FlowDirection
    data_type: STRING
    comment: 'Gas flow direction. Only valid for BB storage, LNG export, or LNG import facilities. RECEIPT:
      the flow of gas into the BB storage or LNG export facility. DELIVERY: the flow of gas out of the
      BB storage or LNG import facility. PROCESSED: used by LNG export and LNG import facilities -- for
      LNG export the amount of gas that can be processed to a liquefied state on a gas day, for LNG import
      the amount that can be received and processed into storage. DELIVERYLNGSTOR: used by LNG import
      facilities -- the amount of gas that can be withdrawn from storage for processing to a gaseous state
      on a gas day. [AI-generated] NONE also occurs in the live data.'
  - column: GasDate
    data_type: string
    comment: Date of gas day. Timestamps are ignored. The gas day as defined in the pipeline contract
      or market rules. [AI-generated] Stored as `yyyy/MM/dd`.
  - column: OutlookQuantity
    data_type: DECIMAL(15,3)
    comment: Capacity outlook quantity to three decimal places. Three decimal places is not required if
      the value has trailing zeros after the decimal place. [AI-generated] TJ, as for the medium-term
      outlook.
  - column: Description
    data_type: STRING
    comment: '[AI-generated] Operator''s free-text condition note; not defined in the guide''s field table
      for this report, but its example gives "This capacity is the amount of gas that this storage facility
      can inject into the Victorian Declared Transmission System". NULL on ~26% of rows.'
  - column: CapacityDescription
    data_type: STRING
    comment: Free text to describe the meaning of the capacity number provided. [AI-generated] NULL on
      ~43% of rows.
  - column: ReceiptLocation
    data_type: INT
    comment: '[AI-generated] The Connection Point Id that best represents the receipt location; -1 for
      BB facilities other than BB pipelines. Not defined in the guide''s field table for this report --
      wording follows the identically named field in section 4.5. Join to silver_gbb_nodes_connection_points.ConnectionPointId;
      note ~2% of delivery-side ids in this report do not resolve against the current register snapshot.'
  - column: ReceiptLocationName
    data_type: STRING
    comment: '[AI-generated] The name of the receipt location. NOT projected into silver -- observed labelling
      connection point 1404074 as "Ballera Receipt Stream" where the register calls it "CGP Ballera Exit".
      Bronze only; join ReceiptLocation to the register instead.'
  - column: DeliveryLocation
    data_type: INT
    comment: '[AI-generated] The Connection Point Id that best represents the delivery location; -1 for
      BB facilities other than BB pipelines. Not defined in the guide''s field table for this report --
      wording follows the identically named field in section 4.5.'
  - column: DeliveryLocationName
    data_type: STRING
    comment: '[AI-generated] The name of the delivery location. NOT projected into silver, for the same
      reason as ReceiptLocationName. Bronze only.'
  - column: LastUpdated
    data_type: string
    comment: '[AI-generated] When the operator last submitted or revised this outlook, `yyyy/MM/dd HH:mm:ss`
      AEST. Not defined in the guide''s field table for this report.'
