PIPELINE_CONNECTION_FLOW:
  table_name: silver_gbb_pipeline_connection_flow
  display_name: Pipeline Connection Flow
  table_comment: 'AEMO Gas Bulletin Board pipeline connection flow. AEMO: "Provides a report for the Daily
    production and usage at each Connection Point." Fed by both variants: GASBB_PIPELINE_CONNECTION_FLOW,
    which "contains historical data from Sep 2018", and GASBB_PIPELINE_CONNECTION_FLOW_LAST_31, which
    contains data from the last 31 days. [AI-generated] One row per gas day, BB pipeline (FacilityId),
    connection point and flow direction, in TJ. This is the connection-point detail behind silver_gbb_actual_flow_storage''s
    facility totals: use it to see which receipt or delivery point gas entered or left a pipeline at (for
    example the individual LNG plant delivery points on the Curtis Island pipelines). Pipelines only --
    production, storage and large-user facilities report in silver_gbb_actual_flow_storage. The full-history
    files were loaded once on 2026-10-01, so coverage runs from gas day 2018-09-29 (a partial first month).
    Rows are restated after the gas day, so bronze holds every published version and this silver table
    keeps the latest per (GasDate, FacilityId, ConnectionPointId, FlowDirection). Gas date is a day label,
    not an instant -- do not timezone-shift it. Join ConnectionPointId to silver_gbb_nodes_connection_points,
    FacilityId to silver_gbb_facilities and LocationId to silver_gbb_locations. Column comments are from
    the AEMO guide v2.2 section 4.8 except those marked [AI-generated].'
  primary_keys:
  - GasDate
  - FacilityId
  - ConnectionPointId
  - FlowDirection
  visibility: Public
  update_frequency: Last31 variant typically updated within 30 minutes of receiving new data; full history
    back to Sep 2018 loaded once
  schema:
  - column: GasDate
    data_type: string
    comment: Date of gas day. Timestamps are ignored. The gas day as defined in the pipeline contract
      or market rules. [AI-generated] Stored as `yyyy/MM/dd`; parse with to_date, never timezone-shift.
  - column: FacilityName
    data_type: STRING
    comment: Name of the facility. [AI-generated] Not a stable key -- join on FacilityId.
  - column: FacilityId
    data_type: INT
    comment: A unique AEMO defined Facility identifier. [AI-generated] Always a BB pipeline in this report.
      Join to silver_gbb_facilities.FacilityId.
  - column: ConnectionPointName
    data_type: STRING
    comment: Names of the connection point. [AI-generated] Not a stable key -- join on ConnectionPointId.
  - column: ConnectionPointId
    data_type: INT
    comment: A unique AEMO defined connection point identifier. [AI-generated] Join to silver_gbb_nodes_connection_points.ConnectionPointId.
  - column: ActualQuantity
    data_type: DECIMAL(18,3)
    comment: The actual flow quantity reported in TJ to the nearest terajoule with three decimal places.
  - column: FlowDirection
    data_type: STRING
    comment: 'A conditional value of either: RECEIPT -- a flow of gas into the BB pipeline, or DELIVERY
      -- a flow of gas out of the BB pipeline.'
  - column: State
    data_type: STRING
    comment: Location. [AI-generated] State code -- NSW, VIC, QLD, SA, TAS, NT.
  - column: LocationName
    data_type: STRING
    comment: Name of the Location. [AI-generated] Join on LocationId rather than this.
  - column: LocationId
    data_type: INT
    comment: Unique Location identifier. [AI-generated] Join to silver_gbb_locations.LocationId.
  - column: Quality
    data_type: STRING
    comment: Indicates whether meter data for the submission date is available. OK -- Actual Quantity
      based on meter data; NIL -- Actual Quantity cannot be determined due to an operational issue; OOR
      -- Out of Range, the submitted value exceeds the High Range set for the connection point's capacity;
      Not Available -- not submitted by the BB reporting entity for the gas date. [AI-generated] Only
      OK and NIL occur in the history loaded on 2026-10-01 (1,310 NIL of 1,641,860 rows). NIL rows mostly
      carry 0.000, which means unknown rather than no flow -- treat them as missing, not as zero.
  - column: LastUpdated
    data_type: string
    comment: The date data was last submitted by the participant. [AI-generated] `yyyy/MM/dd HH:mm:ss`
      AEST. Greatest value per key wins in this silver table; the full revision history is in bronze.
